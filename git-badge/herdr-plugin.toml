id = "herdr-git-badge"
name = "herdr-git-badge"
version = "0.4.0"
description = "Star ($dirty=*) on space and agent titles when the worktree is dirty or unpushed"
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# No focus hooks. Metadata writes during navigate make the last row flash.

[[actions]]
id = "refresh"
title = "Refresh git badges"
description = "Re-scan workspaces for dirty or unpushed git state"
command = ["bash", "scripts/refresh.sh"]
