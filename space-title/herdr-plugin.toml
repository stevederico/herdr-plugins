id = "herdr-space-title"
name = "herdr-space-title"
version = "0.8.0"
description = "Rename spaces from project folder; session title on $folder subtitle (workspace + agent panes); infer repo from tools/memory when cwd is ~/Projects; pin grok session UUID"
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[events]]
on = "pane.focused"
command = ["bash", "scripts/sync.sh"]

[[events]]
on = "tab.focused"
command = ["bash", "scripts/sync.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "scripts/sync.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "scripts/sync.sh"]

[[actions]]
id = "sync"
title = "Sync Space Titles"
description = "Rename workspaces from project folder; copy session titles to the subtitle"
command = ["bash", "scripts/sync.sh"]
