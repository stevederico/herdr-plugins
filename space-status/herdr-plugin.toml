# Clears leftover $status emoji tokens on spaces (Agents sidebar stays plain).
id = "herdr-space-status"
name = "herdr-space-status"
version = "0.3.0"
description = "Clear status emoji tokens on spaces so the Agents sidebar stays plain"
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "scripts/refresh.sh"]

[[events]]
on = "tab.focused"
command = ["bash", "scripts/refresh.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "scripts/refresh.sh"]

[[actions]]
id = "refresh"
title = "Refresh space status"
description = "Clear status emoji tokens on all workspaces"
command = ["bash", "scripts/refresh.sh"]
